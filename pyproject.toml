[tool.poetry]
name = "vk-comments-parser"
version = "1.0.0"
description = "FastAPI application for VK comments monitoring and parsing"
authors = ["Andrey <andrey@example.com>"]
readme = "README.md"
license = "MIT"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.11"

# Core FastAPI Stack
fastapi = "^0.115.14"
uvicorn = {extras = ["standard"], version = "^0.34.3"}

# Data Validation & Settings
pydantic = "^2.11.7"
pydantic-settings = "^2.7.0"

# Database Layer
sqlalchemy = {extras = ["asyncio"], version = "^2.0.41"}
asyncpg = "^0.30.0"
alembic = "^1.15.0"

# HTTP Client
httpx = "^0.28.1"
aiohttp = "^3.12.13"

# Background Tasks & Caching
celery = "^5.5.0"
redis = "^5.2.1"

# Security & Authentication
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
python-multipart = "^0.0.20"

# Utilities
python-dotenv = "^1.0.1"
python-dateutil = "^2.8.2"
aiofiles = "^24.1.0"

# VK API Integration
vkbottle = "^4.5.2"

[tool.poetry.group.dev.dependencies]
# Testing Framework
pytest = "^8.3.3"
pytest-asyncio = "^0.25.0"
pytest-cov = "^6.0.0"
pytest-postgresql = "^6.1.1"

# Code Quality & Formatting
ruff = "^0.8.0"
black = "^24.0.0"
mypy = "^1.13.0"
pre-commit = "^3.8.0"

# Development Tools
ipython = "^8.20.0"

# Type Stubs
types-python-dateutil = "^2.8.19"
types-redis = "^4.6.0"

[tool.poetry.group.production]
optional = true

[tool.poetry.group.production.dependencies]
# Production WSGI/ASGI Server
gunicorn = "^23.0.0"

# Monitoring & Logging
structlog = "^24.4.0"
sentry-sdk = {extras = ["fastapi"], version = "^2.21.0"}

# Performance Optimization
orjson = "^3.10.11"

# Security Headers
secure = "^0.3.0"

# Metrics Collection
prometheus-client = "^0.21.1"

[tool.poetry.scripts]
# Poetry scripts должны быть в формате module:function
# Для CLI команд используйте make или poetry run напрямую

# ================================
# LINTING & FORMATTING CONFIGURATION
# ================================

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = [
    ".git",
    ".mypy_cache",
    ".ruff_cache",
    ".venv",
    "__pycache__",
    "alembic/versions",
    "migrations",
]

# Enable rules
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "C90",   # mccabe complexity
    "B",     # flake8-bugbear
    "UP",    # pyupgrade
    "N",     # pep8-naming
    "S",     # flake8-bandit
    "C4",    # flake8-comprehensions
    "DTZ",   # flake8-datetimez
    "FA",    # flake8-future-annotations
    "PIE",   # flake8-pie
    "T20",   # flake8-print
    "SIM",   # flake8-simplify
    "ERA",   # eradicate
    "TRY",   # tryceratops
    "FLY",   # flynt
    "PERF",  # perflint
    "RUF",   # ruff-specific rules
]

ignore = [
    "E501",   # line too long (handled by black)
    "S101",   # use of assert in tests
    "S603",   # subprocess without shell equals true
    "S607",   # starting process with partial path
    "TRY003", # avoid specifying long messages outside exception class
    "B008",   # do not perform function calls in argument defaults
]

# Per-file ignores
[tool.ruff.per-file-ignores]
"__init__.py" = ["F401", "F403"]
"tests/*" = ["S101", "S106", "S311", "TRY201"]
"migrations/*" = ["ALL"]
"alembic/versions/*" = ["ALL"]
"app/core/config.py" = ["UP007"]  # Use X | Y for union types

# Import sorting (replaces isort)
[tool.ruff.isort]
known-first-party = ["app", "tests"]
section-order = [
    "future",
    "standard-library", 
    "third-party",
    "first-party",
    "local-folder"
]
split-on-trailing-comma = true

# McCabe complexity
[tool.ruff.mccabe]
max-complexity = 10

# pyupgrade settings
[tool.ruff.pyupgrade]
keep-runtime-typing = true

[tool.black]
line-length = 88
target-version = ['py311', 'py312']
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.mypy_cache
  | \.ruff_cache
  | \.venv
  | _build
  | build
  | dist
  | migrations
  | alembic/versions
)/
'''

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_any_generics = false  # Too strict for FastAPI
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false  # FastAPI decorators
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
extra_checks = true
show_error_codes = true

# Plugins
plugins = [
    "pydantic.mypy",
    "sqlalchemy.ext.mypy.plugin"
]

# Per-module configuration
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
strict = false

[[tool.mypy.overrides]]
module = [
    "vk_api.*",
    "vkbottle.*",
    "celery.*",
    "redis.*",
    "alembic.*",
    "secure.*",
    "prometheus_client.*",
]
ignore_missing_imports = true

# Pydantic plugin settings
[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=app",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--cov-fail-under=80",
    "-v"
]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "vk_api: marks tests that require VK API access",
]

[tool.coverage.run]
source = ["app"]
branch = true
omit = [
    "*/tests/*",
    "*/alembic/*",
    "*/migrations/*",
    "*/__init__.py",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.bandit]
exclude_dirs = ["tests", "migrations", "alembic"]
skips = ["B101", "B601"]

[tool.bandit.assert_used]
skips = ["*_test.py", "*test_*.py"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api" 