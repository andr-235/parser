name: CI/CD Pipeline with Deployment

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.11"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  # ================================
  # CODE QUALITY & SECURITY
  # ================================
  quality:
    runs-on: ubuntu-latest
    name: 🔍 Code Quality & Security

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Install system dependencies for PostgreSQL
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --all-extras

      # Code Quality Checks
      - name: 📝 Code formatting and linting
        run: |
          uv run ruff check app tests --output-format=github
        continue-on-error: false

      - name: 🔍 Type checking
        run: uv run mypy app
        continue-on-error: true

      # Security Checks
      - name: 🛡️ Security scans
        run: |
          uv run bandit -r app/ -f json -o bandit-report.json || true
          uv run safety check --json --output safety-report.json || true
        continue-on-error: true

      - name: 🎨 Code style checks
        run: |
          uv run black --check app tests || true
          uv run isort --check-only app tests || true
        continue-on-error: true

  # ================================
  # TESTING
  # ================================
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
        test-type: [unit]

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres # pragma: allowlist secret
          POSTGRES_DB: vk_monitor_test
          POSTGRES_USER: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    name: 🧪 Tests (${{ matrix.test-type }}, Python ${{ matrix.python-version }})

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Install system dependencies for PostgreSQL
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev postgresql-client

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Wait for services
        run: |
          until pg_isready -h localhost -p 5432 -U postgres; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done
          until redis-cli -h localhost -p 6379 ping; do
            echo "Waiting for Redis..."
            sleep 2
          done

      # Skip database migrations for now - will enable when ready
      # - name: Run database migrations
      #   run: uv run alembic upgrade head
      #   env:
      #     DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/vk_monitor_test # pragma: allowlist secret
      #     REDIS_URL: redis://localhost:6379/0

      # Unit Tests
      - name: 🧪 Unit tests
        if: matrix.test-type == 'unit'
        run: |
          if [ -d "tests/unit" ] && [ "$(ls -A tests/unit)" ]; then
            uv run pytest tests/unit/ -v --cov=app --cov-report=xml --cov-report=html
          else
            echo "No unit tests found, skipping..."
          fi
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/vk_monitor_test # pragma: allowlist secret
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key-for-ci-pipeline-minimum-32-chars # pragma: allowlist secret
        continue-on-error: true

      # Integration Tests
      - name: 🔗 Integration tests
        if: matrix.test-type == 'integration'
        run: |
          if [ -d "tests/integration" ] && [ "$(ls -A tests/integration)" ]; then
            uv run pytest tests/integration/ -v --tb=short
          else
            echo "No integration tests found, skipping..."
          fi
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/vk_monitor_test # pragma: allowlist secret
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key-for-ci-pipeline-minimum-32-chars # pragma: allowlist secret
        continue-on-error: true

      # API Tests
      - name: 🌐 API tests
        if: matrix.test-type == 'api'
        run: |
          if [ -d "tests/api" ] && [ "$(ls -A tests/api)" ]; then
            uv run pytest tests/api/ -v --tb=short
          else
            echo "No API tests found, skipping..."
          fi
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/vk_monitor_test # pragma: allowlist secret
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key-for-ci-pipeline-minimum-32-chars # pragma: allowlist secret
          VK_ACCESS_TOKEN: ${{ secrets.VK_TEST_TOKEN || 'dummy-token-for-ci' }}
        continue-on-error: true

      - name: Upload coverage reports
        if: matrix.test-type == 'unit' && matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
        continue-on-error: true

  # ================================
  # DOCKER BUILD (only on push to main/develop)
  # ================================
  build:
    runs-on: ubuntu-latest
    needs: [quality, test]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ================================
  # SECURITY SCANNING (optional)
  # ================================
  security:
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "ghcr.io/${{ github.repository }}:latest"
          format: "sarif"
          output: "trivy-results.sarif"
        continue-on-error: true

      - name: Upload Trivy scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: "trivy-results.sarif"
        continue-on-error: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python
        continue-on-error: true

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        continue-on-error: true
