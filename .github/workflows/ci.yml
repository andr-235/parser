name: CI/CD Pipeline

on:
  push:
    branches: [main, develop, feature/*, hotfix/*]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint-and-security:
    runs-on: ubuntu-latest
    name: Code Quality & Security

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Install system dependencies for PostgreSQL
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --all-extras

      # Code Quality Checks
      - name: Run Ruff linting
        run: uv run ruff check app tests --output-format=github
        continue-on-error: false

      - name: Run MyPy type checking
        run: uv run mypy app
        continue-on-error: true

      # Optional: Run Black formatting check
      - name: Check code formatting
        run: uv run black --check app tests
        continue-on-error: true

  test:
    runs-on: ubuntu-latest
    name: Tests with PostgreSQL & Redis

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres # pragma: allowlist secret
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Install system dependencies for PostgreSQL
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev postgresql-client

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Wait for services
        run: |
          until pg_isready -h localhost -p 5432 -U postgres; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done
          until redis-cli -h localhost -p 6379 ping; do
            echo "Waiting for Redis..."
            sleep 2
          done

      # Skip database migrations for now since we may not have them set up
      # - name: Run database migrations
      #   run: uv run alembic upgrade head
      #   env:
      #     DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/test_db

      - name: Run unit tests
        run: uv run pytest tests/unit/ -v --cov=app --cov-report=xml --cov-report=term-missing
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/test_db # pragma: allowlist secret
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key-for-ci-pipeline-minimum-32-chars # pragma: allowlist secret
        continue-on-error: true

      # Run integration tests only if unit tests directory exists and passes
      - name: Run integration tests
        run: |
          if [ -d "tests/integration" ] && [ "$(ls -A tests/integration)" ]; then
            uv run pytest tests/integration/ -v --tb=short
          else
            echo "No integration tests found, skipping..."
          fi
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/test_db # pragma: allowlist secret
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test-secret-key-for-ci-pipeline-minimum-32-chars # pragma: allowlist secret
        continue-on-error: true
