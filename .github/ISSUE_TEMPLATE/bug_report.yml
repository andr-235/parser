name: 🐛 Bug Report
description: Create a report to help us improve
title: "[BUG] "
labels: [bug, triage]
body:
  - type: checkboxes
    attributes:
      label: Prerequisites
      description: Please confirm the following
      options:
        - label: I have searched existing issues
          required: true
        - label: I have read the documentation
          required: true

  - type: textarea
    attributes:
      label: Description
      description: A clear and concise description of what the bug is
    validations:
      required: true

  - type: textarea
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior
      placeholder: |
        1. Configure monitoring for group '...'
        2. Set keyword '...'
        3. Wait for comment processing
        4. See error
    validations:
      required: true

  - type: textarea
    attributes:
      label: Expected Behavior
      description: What you expected to happen
    validations:
      required: true

  - type: textarea
    attributes:
      label: Actual Behavior
      description: What actually happened
    validations:
      required: true

  - type: input
    attributes:
      label: Environment
      description: Python version, OS, etc.
      placeholder: Python 3.13, Ubuntu 22.04
    validations:
      required: true

  - type: textarea
    attributes:
      label: Additional Context
      description: Add any other context about the problem here
